name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all Compose profiles
        env:
          CITY_DIR: ${{ github.workspace }}/fixture-city
          MY_PROJECT_DIR: ${{ github.workspace }}/fixture-my-project
          GASCITY_SOURCE_DIR: ${{ github.workspace }}/fixture-gascity
          CODEX_AUTH_FILE: ${{ github.workspace }}/fixture-codex-auth.json
          GASCITY_MCP_DIR: ${{ github.workspace }}
          GITEA_BRIDGE_DIR: ${{ github.workspace }}
          OLLAMA_METRICS_DIR: ${{ github.workspace }}
          CITY_NAME: ci-city
          CITY_MAIL_LAUNCHER_RIG: my-project
          TAILNET_IP: 100.64.0.1
          STACK_USERNAME: ci-admin
          STACK_PASSWORD: ci-only-not-a-secret
          GRAFANA_ADMIN_PASSWORD: ci-only-not-a-secret
          GITEA_MAYOR_TOKEN: ci-mayor-token
          GITEA_OBSERVER_TOKEN: ci-observer-token
          GITEA_WITNESS_TOKEN: ci-witness-token
        run: |
          docker compose config --quiet
          docker compose --profile city --profile models --profile mcp --profile gitea-mcp --profile gitea-bridge config --quiet
      - name: Build the local adapter image
        run: docker build --tag gascity-role-health:ci role-health
      - name: Check the smoke script parses
        run: |
          sh -n scripts/smoke.sh
          sh -n scripts/gitea-mcp-preflight.sh
          sh -n scripts/gitea-mcp-bootstrap.sh
          sh -n scripts/gitea-mcp-smoke.sh
          sh -n scripts/gitea-bridge-bootstrap.sh
