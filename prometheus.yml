global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: ollama-metrics
    static_configs:
      - targets: [ollama-metrics:8080]
