version = 1

# The signed intake has the installation token for this delivery. It uses it
# once to read every PR-files page, records the exact SHA-bound run, and only
# then dispatches a City reviewer. Projection happens later in the durable
# runtime loop with the App's own credentials.
[[rule]]
id = "docs-impact-pr-opened"
event = "pull_request"
[rule.match]
action = "opened"
[[rule.action]]
type = "command"
command = ["python3", "/opt/gascity-compose/scripts/github_docs_impact_compose_adapter.py", "intake", "--once"]
github_app_token_env = "GH_TOKEN"

[[rule]]
id = "docs-impact-pr-reopened"
event = "pull_request"
[rule.match]
action = "reopened"
[[rule.action]]
type = "command"
command = ["python3", "/opt/gascity-compose/scripts/github_docs_impact_compose_adapter.py", "intake", "--once"]
github_app_token_env = "GH_TOKEN"

[[rule]]
id = "docs-impact-pr-synchronize"
event = "pull_request"
[rule.match]
action = "synchronize"
[[rule.action]]
type = "command"
command = ["python3", "/opt/gascity-compose/scripts/github_docs_impact_compose_adapter.py", "intake", "--once"]
github_app_token_env = "GH_TOKEN"

[[rule]]
id = "docs-impact-pr-ready-for-review"
event = "pull_request"
[rule.match]
action = "ready_for_review"
[[rule.action]]
type = "command"
command = ["python3", "/opt/gascity-compose/scripts/github_docs_impact_compose_adapter.py", "intake", "--once"]
github_app_token_env = "GH_TOKEN"
