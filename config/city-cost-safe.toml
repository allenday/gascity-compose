# Opinionated inference policy for the Gastown pack.
#
# Operational agents run on local/tailnet hardware. The Mayor uses the remote
# reasoning profile but is materialized only when explicitly addressed or
# assigned work. Polecats and other implementation agents are intentionally
# not patched, so they inherit the workspace's capable coding provider.

[providers.codex-tailnet]
base = "builtin:codex"
ready_delay_ms = 0
args_append = ["--profile", "tailnet"]
options_schema_merge = "by_key"
options_schema = [{ key = "model", omit = true }]

[providers.codex-mayor-runpod]
base = "builtin:codex"
command = "/usr/local/bin/codex-mayor"
resume_command = "/usr/local/bin/codex-mayor resume {{.SessionKey}}"
ready_delay_ms = 0
args_append = ["--profile", "mayor"]
options_schema_merge = "by_key"
options_schema = [{ key = "model", omit = true }]

# Fixed direct-Codex lane for sanitized GitHub docs evidence. It uses the
# City's existing CODEX_HOME/auth and exposes no model/API credential to a
# sidecar. Model and effort cannot be selected by routed bead content.
[providers.codex-docs-impact]
base = "builtin:codex"
ready_delay_ms = 0
args_append = ["--model", "gpt-5.6-terra", "-c", "model_reasoning_effort=medium"]
options_schema_merge = "by_key"
options_schema = [{ key = "model", omit = true }, { key = "effort", omit = true }]

[providers.codex-docs-impact.env]
GH_TOKEN = ""
GITHUB_TOKEN = ""
GITHUB_APP_ID = ""
GITHUB_APP_PRIVATE_KEY_PEM = ""
GITHUB_WEBHOOK_SECRET = ""

[[patches.agent]]
name = "gastown.deacon"
provider = "codex-tailnet"

[[patches.agent]]
name = "gastown.boot"
provider = "codex-tailnet"

[[patches.agent]]
name = "gastown.dog"
provider = "codex-tailnet"

[[patches.agent]]
name = "gastown.mayor"
provider = "codex-mayor-runpod"

[[patches.agent]]
rig = "*"
name = "gastown.witness"
provider = "codex-tailnet"

[[patches.agent]]
rig = "*"
name = "gastown.refinery"
provider = "codex-tailnet"

[[patches.named_session]]
name = "gastown.mayor"
mode = "on_demand"
