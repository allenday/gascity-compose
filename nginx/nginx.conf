user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS lets optional profile services appear later
    # without forcing the gateway itself to restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $server_port $backend {
        3000  grafana:3000;
        3002  gitea:3000;
        8081  gatus:8080;
        9090  prometheus:9090;
        3100  loki:3100;
        4318  otel-collector:4318;
        8372  city:8372;
        11435 ollama:11434;
        8766  gascity-mcp:8766;
        8771  gitea-mcp-mayor:8080;
        8772  gitea-mcp-observer:8080;
        8773  gitea-mcp-witness:8080;
        3003  buzz-relay:3000;
    }

    map $server_port $upstream_host {
        # Gas City validates Host explicitly.
        8372  "127.0.0.1:8372";
        default $http_host;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        # Keep the service directory's Gitea entry on this gateway. Gitea
        # itself remains a port-routed reverse-proxy service to avoid a
        # subpath deployment and its associated URL rewriting.
        location = /gitea {
            return 302 $scheme://$host:3002/;
        }

        # This is the only public route needed by the opt-in GitHub App.
        # The worker itself has no published Docker port.
        location = /v0/github/webhook {
            proxy_pass http://city:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Convenience landing page for the manifest flow. It is served only
        # through Tailnet Serve; the public Funnel rule is path-scoped away
        # from it.
        location = /v0/github/admin {
            proxy_pass http://city:8081/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Revision-specific documentation-impact evidence lives beneath the
        # admin landing page. Preserve this URI when proxying: the service
        # deliberately binds evidence to repository, pull request, and SHA.
        location ^~ /v0/github/admin/ {
            proxy_pass http://city:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # This route is available only on the Tailnet listener. Funnel is
        # configured with the exact webhook path above and never includes it.
        location ^~ /v0/github/app/ {
            proxy_pass http://city:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 3000;
        listen 3002;
        listen 8081;
        listen 9090;
        listen 3100;
        listen 4318;
        listen 8372;
        listen 11435;
        listen 8766;
        listen 8771;
        listen 8772;
        listen 8773;
        listen 3003;

        location / {
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $upstream_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
