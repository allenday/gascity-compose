user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS lets optional profile services appear later
    # without forcing the gateway itself to restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $server_port $backend {
        3000  grafana:3000;
        3002  gitea:3000;
        8081  gatus:8080;
        9090  prometheus:9090;
        3100  loki:3100;
        4318  otel-collector:4318;
        8372  city:8372;
        11435 ollama:11434;
        8766  gascity-mcp:8766;
        8771  gitea-mcp-mayor:8080;
        8772  gitea-mcp-observer:8080;
        8773  gitea-mcp-witness:8080;
    }

    map $server_port $upstream_host {
        # Gas City validates Host explicitly.
        8372  "127.0.0.1:8372";
        default $http_host;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        # Keep the service directory's Gitea entry on this gateway. Gitea
        # itself remains a port-routed reverse-proxy service to avoid a
        # subpath deployment and its associated URL rewriting.
        location = /gitea {
            return 302 $scheme://$host:3002/;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 3000;
        listen 3002;
        listen 8081;
        listen 9090;
        listen 3100;
        listen 4318;
        listen 8372;
        listen 11435;
        listen 8766;
        listen 8771;
        listen 8772;
        listen 8773;

        location / {
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $upstream_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
