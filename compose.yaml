name: gascity

services:
  # Single Tailnet-facing ingress. Every application remains published on
  # loopback as well; Nginx is the only listener on the Tailnet address.
  nginx:
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    ports:
      - "${TAILNET_IP:?Set TAILNET_IP in .env}:80:80"
      # Dev-only public webhook ingress. Bind it only when a host firewall
      # allows GitHub's webhook CIDRs; use a non-public loopback default.
      - "${GITHUB_WEBHOOK_WAN_IP:-127.0.0.1}:${GITHUB_WEBHOOK_WAN_PORT:-8088}:80"
      - "${TAILNET_IP:?Set TAILNET_IP in .env}:${GRAFANA_PORT:-3000}:3000"
      - "${TAILNET_IP:?Set TAILNET_IP in .env}:${GITEA_HTTP_PORT:-3002}:3002"
      - "${TAILNET_IP:?Set TAILNET_IP in .env}:${GATUS_PORT:-8081}:8081"
      - "${TAILNET_IP:?Set TAILNET_IP in .env}:${PROMETHEUS_PORT:-9090}:9090"
      - "${TAILNET_IP:?Set TAILNET_IP in .env}:${LOKI_PORT:-3100}:3100"
      - "${TAILNET_IP:?Set TAILNET_IP in .env}:4318:4318"
      - "${TAILNET_IP:?Set TAILNET_IP in .env}:8372:8372"
      - "${TAILNET_IP:?Set TAILNET_IP in .env}:${OLLAMA_PORT:-11435}:11435"
      - "${TAILNET_IP:?Set TAILNET_IP in .env}:${GASCITY_MCP_PORT:-8766}:8766"
      - "${TAILNET_IP:?Set TAILNET_IP in .env}:${GITEA_MCP_MAYOR_PORT:-8771}:8771"
      - "${TAILNET_IP:?Set TAILNET_IP in .env}:${GITEA_MCP_OBSERVER_PORT:-8772}:8772"
      - "${TAILNET_IP:?Set TAILNET_IP in .env}:${GITEA_MCP_WITNESS_PORT:-8773}:8773"
      # Buzz remains private to the Tailnet; the relay itself is never published.
      - "${TAILNET_IP:?Set TAILNET_IP in .env}:${BUZZ_PORT:-3003}:3003"
    depends_on:
      grafana:
        condition: service_started
      gitea:
        condition: service_healthy
      gatus:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      buzz-relay:
        condition: service_healthy
        required: false
      github-webhook:
        condition: service_started
        required: false
      github-admin:
        condition: service_started
        required: false

  # GitHub App ingress is opt-in. The worker has no host port: Nginx is the
  # sole HTTP hop and Tailscale Funnel exposes only its webhook path.
  github-webhook:
    profiles: [github-docs-impact]
    build:
      context: .
      dockerfile: Dockerfile.city
      target: launcher-runtime
      args:
        GASCITY_REF: ${GASCITY_REF:-ab54f93c3b3d30bb8f52f7e92c0761fb75340752}
        GASCITY_REPOSITORY: ${GASCITY_REPOSITORY:-https://github.com/gastownhall/gascity.git}
        CAGENT_REF: ${CAGENT_REF:-v1.23.0}
    entrypoint: ["python3", "-u", "/opt/gascity-packs/github/scripts/github_intake_service.py"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      GC_SERVICE_NAME: github-webhook
      GC_SERVICE_HOST: 0.0.0.0
      GC_SERVICE_PORT: "8080"
      GC_CITY_ROOT: ${CITY_DIR:?Set CITY_DIR in .env to the absolute city path}
      GC_SERVICE_STATE_ROOT: /var/lib/github-intake
      HOME: /var/lib/github-intake/home
      GC_GITHUB_INTAKE_RULES_FILE: /run/github-intake/rules.toml
      GC_GITHUB_DOCS_PATCH_SNAPSHOT_DIR: /var/lib/github-intake/docs-patch-snapshots
      GC_GITHUB_DOCS_PATCH_ARTIFACT_DIR: /var/lib/github-intake/docs-patch-artifacts
      GC_GITHUB_DOCS_REVIEW_WAIT_SECONDS: ${GC_GITHUB_DOCS_REVIEW_WAIT_SECONDS:-305}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_PRIVATE_KEY_PEM: ${GITHUB_APP_PRIVATE_KEY_PEM:-}
      GITHUB_INTAKE_WEBHOOK_PUBLIC_URL: ${GITHUB_INTAKE_WEBHOOK_PUBLIC_URL:-}
      GITHUB_INTAKE_WEBHOOK_HOOK_URL: ${GITHUB_INTAKE_WEBHOOK_HOOK_URL:-}
    volumes:
      - ${GITHUB_PACK_DIR:-../gascity-packs}:/opt/gascity-packs:ro
      - ${CITY_DIR:?Set CITY_DIR in .env to the absolute city path}:${CITY_DIR:?Set CITY_DIR in .env to the absolute city path}
      - ./config/github-intake/rules.toml:/run/github-intake/rules.toml:ro
      - ./state/github-intake:/var/lib/github-intake
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # The App manifest/callback surface is Tailnet-only. It shares durable
  # intake state with the webhook process but has a separate listener, so the
  # public Funnel can stay constrained to the signed webhook path.
  github-admin:
    profiles: [github-docs-impact]
    image: gascity-github-webhook
    entrypoint: ["python3", "-u", "/opt/gascity-packs/github/scripts/github_intake_service.py"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      GC_SERVICE_NAME: github-admin
      GC_SERVICE_HOST: 0.0.0.0
      GC_SERVICE_PORT: "8081"
      GC_CITY_ROOT: ${CITY_DIR:?Set CITY_DIR in .env to the absolute city path}
      GC_SERVICE_STATE_ROOT: /var/lib/github-intake
      HOME: /var/lib/github-intake/home
      GITHUB_INTAKE_ADMIN_PUBLIC_URL: ${GITHUB_INTAKE_ADMIN_PUBLIC_URL:-}
      GITHUB_INTAKE_WEBHOOK_PUBLIC_URL: ${GITHUB_INTAKE_WEBHOOK_PUBLIC_URL:-}
      GITHUB_INTAKE_WEBHOOK_HOOK_URL: ${GITHUB_INTAKE_WEBHOOK_HOOK_URL:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_PRIVATE_KEY_PEM: ${GITHUB_APP_PRIVATE_KEY_PEM:-}
    volumes:
      - ${GITHUB_PACK_DIR:-../gascity-packs}:/opt/gascity-packs:ro
      - ${CITY_DIR:?Set CITY_DIR in .env to the absolute city path}:${CITY_DIR:?Set CITY_DIR in .env to the absolute city path}
      - ./state/github-intake:/var/lib/github-intake
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # Untrusted, persistent TechDocs queue consumer. The trusted GitHub supervisor
  # materializes a redacted, revision-bound assignment before this worker runs
  # and is solely responsible for projecting validated output and publishing.
  # This service deliberately has no credentials, City/config bind mount, or
  # host port. Snapshot and artifact directories are separate so the worker
  # cannot change the supervisor's durable intake state.
  github-docs-patch-worker:
    profiles: [github-docs-impact]
    image: gascity-github-webhook
    entrypoint:
      - /bin/sh
      - -ec
      - |
        worker=/opt/gascity-packs/github/scripts/github_intake_docs_patch_queue_worker.py
        test -f "$$worker" || { echo "GitHub pack lacks github_intake_docs_patch_queue_worker.py" >&2; exit 64; }
        exec python3 -u "$$worker"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      GC_TECHDOCS_SNAPSHOT_DIR: /work/snapshot
      GC_TECHDOCS_ARTIFACT_DIR: /work/artifact
      # No runtime is assumed: an unset or unavailable adapter emits no review.
      GC_TECHDOCS_ADAPTER_COMMAND: ${GC_TECHDOCS_ADAPTER_COMMAND:-}
      GC_TECHDOCS_ADAPTER_TIMEOUT_SECONDS: ${GC_TECHDOCS_ADAPTER_TIMEOUT_SECONDS:-300}
      GC_TECHDOCS_SKILL_DIR: /opt/gascity-packs/github/skills/developer-experience-techdocs
      GC_TECHDOCS_CANDIDATE_DIR: /work/candidate
      HOME: /tmp
    volumes:
      - ${GITHUB_PACK_DIR:-../gascity-packs}:/opt/gascity-packs:ro
      - ./state/github-intake/docs-patch-snapshots:/work/snapshot:ro
      - ./state/github-intake/docs-patch-artifacts:/work/artifact
      - ./state/github-intake/docs-patch-candidates:/work/candidate:ro
    read_only: true
    network_mode: "none"
    tmpfs:
      - /tmp:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Restarting is safe: queue output is accepted only when its digest matches
    # the revision-bound snapshot, and malformed/stale output is recomputed.
    restart: unless-stopped

  # Deliberately profile-gated: never run two supervisors against one city.
  city:
    profiles: [city]
    # Match the owner of linked city/rig paths so Gas City can maintain their
    # local Dolt mirrors without granting the controller root access.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile.city
      args:
        # Pin this to the commit used by the host supervisor before handoff.
        GASCITY_REF: ${GASCITY_REF:-ab54f93c3b3d30bb8f52f7e92c0761fb75340752}
        GASCITY_REPOSITORY: ${GASCITY_REPOSITORY:-https://github.com/gastownhall/gascity.git}
        CAGENT_REF: ${CAGENT_REF:-v1.23.0}
    environment:
      GC_HOME: /var/lib/gascity
      HOME: /var/lib/gascity/home
      CITY_PATH: ${CITY_DIR:?Set CITY_DIR in .env to the absolute city path}
      CITY_NAME: ${CITY_NAME:-my-city}
      GC_OTEL_METRICS_URL: http://otel-collector:4318/v1/metrics
      GC_OTEL_LOGS_URL: http://otel-collector:4318/v1/logs
      # Route inference through the local fork's metrics proxy. The proxy keeps
      # the OpenAI-compatible endpoint intact while recording request usage.
      OLLAMA_HOST: http://ollama-metrics:8080
      # Used by city.toml's Runpod upstream via a $RUNPOD_API_KEY reference.
      # Pass it from the host environment when creating/recreating this service;
      # it is deliberately not committed to the compose environment file.
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      # Non-secret signal coordinates let the in-container watcher wake Mayor.
      # Mail credentials are read only by the Mayor provider wrapper from the
      # mounted role file; they never enter the supervisor's ambient env.
      MCP_AGENT_MAIL_PROJECT_KEY: ${MCP_AGENT_MAIL_PROJECT_KEY:-bootstrap-required}
      MCP_AGENT_MAIL_MAYOR_IDENTITY: ${INTAKE_MAIL_MAYOR_IDENTITY:-gas-city-mayor}
      CITY_MAIL_WAKE_ENABLED: ${CITY_MAIL_WAKE_ENABLED:-true}
      CITY_MAIL_LOCAL_LAUNCH_ENABLED: ${CITY_MAIL_LOCAL_LAUNCH_ENABLED:-true}
      CITY_MAIL_LAUNCHER_QUEUE: /var/lib/city-mail-launcher
      # The local worker runs inside this service, so it needs the same
      # non-secret, allow-listed formula rig as the Mail-facing sidecar.
      CITY_MAIL_LAUNCHER_RIG: ${CITY_MAIL_LAUNCHER_RIG:?set CITY_MAIL_LAUNCHER_RIG to the authorized City rig}
      CITY_MAIL_SIGNAL_FILE: /var/lib/mcp-mail-signals/projects/${MCP_AGENT_MAIL_PROJECT_KEY:-bootstrap-required}/agents/${INTAKE_MAIL_MAYOR_IDENTITY:-gas-city-mayor}.signal
      # Non-secret profile settings rendered into ephemeral CODEX_HOME.
      TAILNET_OLLAMA_BASE_URL: ${TAILNET_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      RUNPOD_OPENAI_BASE_URL: ${RUNPOD_OPENAI_BASE_URL:-https://api.runpod.ai/v2/not-configured/openai/v1}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma4:12b-it-qat}
      # Batteries-included build methodology. The pack itself materializes its
      # vendored skills for every provider; no Codex-only skill install is needed.
      SUPERPOWERS_PACK_ENABLED: ${SUPERPOWERS_PACK_ENABLED:-true}
      SUPERPOWERS_PACK_SOURCE: ${SUPERPOWERS_PACK_SOURCE:-https://github.com/gastownhall/gascity-packs/tree/main/superpowers}
      SUPERPOWERS_PACK_VERSION: ${SUPERPOWERS_PACK_VERSION:-sha:3b3b89f2011e06d84459aa7bea1552382f13930a}
      # Review sanitized exact-SHA evidence through this already-authenticated
      # trusted City. The reviewer has no GitHub credential or publisher path.
      GC_CITY_DOCS_REVIEW_ENABLED: ${GC_CITY_DOCS_REVIEW_ENABLED:-true}
      GC_CITY_DOCS_REVIEW_TARGET: github.docs-impact-reviewer
      GC_CITY_DOCS_SNAPSHOT_DIR: /var/lib/github-docs-impact/snapshot
      GC_CITY_DOCS_IMMUTABLE_DIR: /var/lib/github-docs-impact/immutable
      GC_CITY_DOCS_CANDIDATE_DIR: /var/lib/github-docs-impact/candidate
      GC_CITY_DOCS_DISPATCH_DIR: /var/lib/github-docs-impact/dispatch
      GC_CITY_DOCS_SKILL_DIR: /opt/gascity-packs/github/skills/developer-experience-techdocs
      CODEX_HOME: /run/codex
      DOLT_USER_NAME: ${DOLT_USER_NAME:-Allen Day}
      DOLT_USER_EMAIL: ${DOLT_USER_EMAIL:-allenday@allenday.com}
    volumes:
      - ${CITY_DIR:?Set CITY_DIR in .env to the absolute city path}:${CITY_DIR:?Set CITY_DIR in .env to the absolute city path}
      - ${MY_PROJECT_DIR:?Set MY_PROJECT_DIR in .env to the linked rig path}:${MY_PROJECT_DIR:?Set MY_PROJECT_DIR in .env to the linked rig path}
      - ${GASCITY_SOURCE_DIR:?Set GASCITY_SOURCE_DIR in .env to the Gas City source rig}:${GASCITY_SOURCE_DIR:?Set GASCITY_SOURCE_DIR in .env to the Gas City source rig}
      - ${GITHUB_PACK_DIR:-../gascity-packs}:/opt/gascity-packs:ro
      - ${CODEX_AUTH_FILE:?Set CODEX_AUTH_FILE in .env to the host Codex auth file}:/run/secrets/codex-auth.json:ro
      - ./codex:/run/secrets/codex-config:ro
      - ./state/city-mail-secrets:/run/secrets/city-mail:ro
      - ./state/mcp-agent-mail/signals:/var/lib/mcp-mail-signals:ro
      - ./state/city-mail-launcher:/var/lib/city-mail-launcher
      - ./state/github-intake/docs-patch-snapshots:/var/lib/github-docs-impact/snapshot:ro
      - ./state/github-intake/docs-patch-candidates:/var/lib/github-docs-impact/candidate
      - ./state/github-intake/docs-review-immutable:/var/lib/github-docs-impact/immutable
      - ./state/github-intake/docs-review-dispatch:/var/lib/github-docs-impact/dispatch
      - ./state/gc-runtime:/var/lib/gascity
    tmpfs:
      # The City process runs as the configured unprivileged host UID/GID,
      # which copies the read-only host credential into this ephemeral home.
      - /run/codex:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0700
    ports:
      - "127.0.0.1:8372:8372"
    depends_on:
      otel-collector:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    # City requires a reachable model service; the models profile remains
    # useful for explicit model pulling through model-init.
    profiles: [city, models]
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./state/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 12

  ollama-metrics:
    profiles: [city]
    build:
      # The fork is checked out locally while the upstream contribution is
      # pending. This stays source-visible and avoids an unpublished image tag.
      context: ${OLLAMA_METRICS_DIR:-../ollama-metrics}
    environment:
      OLLAMA_HOST: http://ollama:11434
      PORT: "8080"
      # cagent streams through /v1/chat/completions. Ask Ollama for its final
      # usage chunk so the proxy can account for prompt/completion tokens.
      INCLUDE_STREAM_USAGE: "true"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  model-init:
    profiles: [models]
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    entrypoint: ["/bin/sh", "-ec", "ollama pull \"$${OLLAMA_MODEL}\""]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  gitea:
    image: gitea/gitea:1.27.2-rootless
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: 127.0.0.1
      # Webhook payloads persist this URL as Woodpecker's clone address, so it
      # must resolve from workflow containers on the isolated CI network.
      # Browser requests retain their Nginx proxy-facing host via detection.
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__PUBLIC_URL_DETECTION: auto
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__server__SSH_DOMAIN: 127.0.0.1
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2223}
      GITEA__server__SSH_LISTEN_PORT: "2222"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      # OAuth browser redirects use loopback; the webhook allow-list below is
      # separate and permits only the Docker-local webhook consumers.
      GITEA__security__ALLOWED_HOST_LIST: loopback,woodpecker-server,gitea-mail-bridge
      GITEA__webhook__ALLOWED_HOST_LIST: 127.0.0.1,localhost,woodpecker-server,gitea-mail-bridge
      GITEA__log__LEVEL: info
    ports:
      - "127.0.0.1:${GITEA_HTTP_PORT:-3002}:3000"
      - "127.0.0.1:${GITEA_SSH_PORT:-2223}:2222"
    volumes:
      - ${GITEA_STATE_DIR:-./state/gitea}/data:/var/lib/gitea
      - ${GITEA_STATE_DIR:-./state/gitea}/config:/etc/gitea
    networks:
      - default
      - woodpecker
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  # CI is deliberately opt-in. The server is localhost-only, accepts only the
  # fixture account by default, and has no path to City or Gitea bridge tokens.
  woodpecker-server:
    profiles: [woodpecker]
    image: woodpeckerci/woodpecker-server:v3.12.0
    restart: unless-stopped
    environment:
      WOODPECKER_SERVER_ADDR: 0.0.0.0:8000
      WOODPECKER_GRPC_ADDR: 0.0.0.0:9000
      WOODPECKER_HOST: ${WOODPECKER_HOST:-http://127.0.0.1:8000}
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN:-woodpecker-fixture}
      WOODPECKER_OPEN: "false"
      WOODPECKER_GITEA: "true"
      # API calls use Docker DNS; browser OAuth must use the loopback-published
      # Gitea address rather than the internal `gitea` hostname.
      WOODPECKER_GITEA_URL: http://gitea:3000
      WOODPECKER_EXPERT_FORGE_OAUTH_HOST: ${WOODPECKER_GITEA_BROWSER_URL:-http://127.0.0.1:${GITEA_HTTP_PORT:-3002}}
      # Gitea emits webhooks from its container, where 127.0.0.1 would point
      # back to Gitea rather than the loopback-published Woodpecker server.
      WOODPECKER_EXPERT_WEBHOOK_HOST: http://woodpecker-server:8000
      WOODPECKER_GITEA_CLIENT: ${WOODPECKER_GITEA_CLIENT:-}
      WOODPECKER_GITEA_SECRET: ${WOODPECKER_GITEA_SECRET:-}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-}
      WOODPECKER_REPO_OWNERS: ${WOODPECKER_REPO_OWNERS:-woodpecker-fixture}
      # The profile admits only its configured admin while registration is
      # closed; this package token is available only to that fixture's runs.
      WOODPECKER_ENVIRONMENT: GITEA_FIXTURE_PACKAGE_TOKEN:${GITEA_WOODPECKER_PACKAGE_TOKEN:-},GITEA_FIXTURE_PUBLIC_URL:${WOODPECKER_GITEA_BROWSER_URL:-http://127.0.0.1:${GITEA_HTTP_PORT:-3002}}
      WOODPECKER_DEFAULT_PIPELINE_TIMEOUT: ${WOODPECKER_PIPELINE_TIMEOUT:-15}
      WOODPECKER_LOG_LEVEL: warn
    volumes:
      - ${WOODPECKER_STATE_DIR:-./state/woodpecker}:/var/lib/woodpecker
    ports:
      - "127.0.0.1:${WOODPECKER_PORT:-8000}:8000"
    networks:
      - woodpecker
    depends_on:
      gitea:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/woodpecker-server", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # The Docker backend needs the host daemon to create isolated step
  # containers. Only this agent sees the socket; pipelines receive neither the
  # socket nor privileged-plugin permission. Keep the fixture repository
  # private and do not widen WOODPECKER_REPO_OWNERS without a runner review.
  woodpecker-agent:
    profiles: [woodpecker]
    image: woodpeckerci/woodpecker-agent:v3.12.0
    restart: unless-stopped
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-}
      WOODPECKER_MAX_WORKFLOWS: "1"
      WOODPECKER_HEALTHCHECK_ADDR: :3001
      # Workflow containers must use the same isolated network as Gitea so
      # Gitea's API-reported `http://gitea:3000` clone URL is reachable.
      WOODPECKER_BACKEND_DOCKER_NETWORK: gascity-woodpecker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      woodpecker-server:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - woodpecker

  # Upstream's single-node Buzz dependencies are profile-gated together. Every
  # mutable directory is a host bind under ./state so backup and retention stay
  # under this repository's existing operational model.
  buzz-relay:
    profiles: [buzz]
    # Upstream publishes the tag from this exact source revision; the digest
    # makes the deployed multi-architecture manifest immutable as well.
    image: ghcr.io/block/buzz:sha-53771c8@sha256:a3f2ef1559d32ec9b999f8aab4389adc0aa179a22493ff8d1da8763e5e011744
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://${BUZZ_POSTGRES_USER:-buzz}:${BUZZ_POSTGRES_PASSWORD:?Set BUZZ_POSTGRES_PASSWORD in .env}@buzz-postgres:5432/${BUZZ_POSTGRES_DB:-buzz}
      REDIS_URL: redis://:${BUZZ_REDIS_PASSWORD:?Set BUZZ_REDIS_PASSWORD in .env}@buzz-redis:6379
      BUZZ_S3_ENDPOINT: http://buzz-minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?Set BUZZ_S3_ACCESS_KEY in .env}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?Set BUZZ_S3_SECRET_KEY in .env}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY:?Set BUZZ_RELAY_PRIVATE_KEY in .env}
      BUZZ_GIT_HOOK_HMAC_SECRET: ${BUZZ_GIT_HOOK_HMAC_SECRET:?Set BUZZ_GIT_HOOK_HMAC_SECRET in .env}
      RELAY_URL: ${BUZZ_RELAY_URL:?Set BUZZ_RELAY_URL in .env}
      BUZZ_MEDIA_BASE_URL: ${BUZZ_MEDIA_BASE_URL:?Set BUZZ_MEDIA_BASE_URL in .env}
      BUZZ_MEDIA_SERVER_DOMAIN: ${BUZZ_MEDIA_SERVER_DOMAIN:?Set BUZZ_MEDIA_SERVER_DOMAIN in .env}
      BUZZ_CORS_ORIGINS: ${BUZZ_CORS_ORIGINS:?Set BUZZ_CORS_ORIGINS in .env}
      RELAY_OWNER_PUBKEY: ${BUZZ_RELAY_OWNER_PUBKEY:?Set BUZZ_RELAY_OWNER_PUBKEY in .env}
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_REQUIRE_MEDIA_GET_AUTH: "true"
      BUZZ_ALLOW_NIP_OA_AUTH: "true"
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_GIT_CONFORMANCE_PROBE: "true"
    volumes:
      - ./state/buzz-git:/data/git
    depends_on:
      buzz-postgres:
        condition: service_healthy
      buzz-redis:
        condition: service_healthy
      buzz-minio:
        condition: service_healthy
      buzz-minio-init:
        condition: service_completed_successfully
    healthcheck:
      # The upstream runtime contains bash but not curl/wget. Check both
      # endpoints: liveness detects process failure and readiness gates Nginx.
      test: ["CMD-SHELL", "bash -ec 'for path in /_liveness /_readiness; do exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET %s HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" \"$$path\" >&3; grep -q \"200 OK\" <&3; exec 3>&-; done'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  buzz-postgres:
    profiles: [buzz]
    # Keep the readable release tag while pinning the multi-architecture manifest.
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ${BUZZ_POSTGRES_DB:-buzz}
      POSTGRES_USER: ${BUZZ_POSTGRES_USER:-buzz}
      POSTGRES_PASSWORD: ${BUZZ_POSTGRES_PASSWORD:?Set BUZZ_POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./state/buzz-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  buzz-redis:
    profiles: [buzz]
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${BUZZ_REDIS_PASSWORD:?Set BUZZ_REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${BUZZ_REDIS_PASSWORD:?Set BUZZ_REDIS_PASSWORD in .env}
    volumes:
      - ./state/buzz-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  buzz-minio:
    profiles: [buzz]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BUZZ_S3_ACCESS_KEY:?Set BUZZ_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${BUZZ_S3_SECRET_KEY:?Set BUZZ_S3_SECRET_KEY in .env}
    volumes:
      - ./state/buzz-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  buzz-minio-init:
    profiles: [buzz]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      buzz-minio:
        condition: service_healthy
    environment:
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?Set BUZZ_S3_ACCESS_KEY in .env}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?Set BUZZ_S3_SECRET_KEY in .env}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
    entrypoint: >
      /bin/sh -euc '
      mc alias set local http://buzz-minio:9000 "$$BUZZ_S3_ACCESS_KEY" "$$BUZZ_S3_SECRET_KEY"
      mc mb --ignore-existing "local/$$BUZZ_S3_BUCKET"
      mc anonymous set none "local/$$BUZZ_S3_BUCKET"
      '
    restart: "no"

  mcp-agent-mail:
    profiles: [mcp, gitea-mail-bridge, buzz-mayor-bridge]
    build:
      context: .
      dockerfile: Dockerfile.mcp-agent-mail
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$HTTP_BEARER_TOKEN"
        test "$$HTTP_BEARER_TOKEN" != bootstrap-required
        exec python3 -m mcp_agent_mail.http --host 0.0.0.0 --port 8765
    environment:
      HTTP_PATH: /mcp/
      HTTP_BEARER_TOKEN: ${MCP_AGENT_MAIL_BEARER_TOKEN:-bootstrap-required}
      HTTP_RBAC_DEFAULT_ROLE: writer
      HTTP_ALLOW_LOCALHOST_UNAUTHENTICATED: "false"
      NOTIFICATIONS_ENABLED: "true"
      NOTIFICATIONS_SIGNALS_DIR: /var/lib/mcp-mail/signals
    volumes:
      - ./state/mcp-agent-mail:/var/lib/mcp-mail
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/liveness')"]
      interval: 15s
      timeout: 5s
      retries: 8

  # One private Buzz channel -> Mayor Agent Mail adapter. It deliberately has
  # no tracker, City, Codex, or Mayor credentials and owns only its replay
  # ledger. The source checkout must already be the pinned, clean revision.
  buzz-mayor-bridge:
    profiles: [buzz-mayor-bridge]
    user: "65532:65532"
    build:
      context: ${GASCITY_GITEA_DIR:-${GITEA_BRIDGE_DIR:-../gascity-gitea}}
      args:
        # .env.example pins the merged dual-coordinate bridge core. Preflight
        # also rejects anything except a clean checkout at this full object ID.
        GASCITY_GITEA_REF: ${GASCITY_GITEA_REF:?Set GASCITY_GITEA_REF in .env}
      dockerfile_inline: |
        FROM golang:1.24-alpine AS build
        ARG GASCITY_GITEA_REF
        RUN apk add --no-cache git busybox-static
        WORKDIR /src
        COPY go.mod ./
        RUN go mod download
        COPY . .
        RUN test -z "$$(git status --porcelain --untracked-files=all)" \
            && test "$$(git rev-parse HEAD)" = "$${GASCITY_GITEA_REF}" \
            && CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /out/buzz-mayor-bridge ./cmd/buzz-mayor-bridge
        FROM gcr.io/distroless/static-debian12:nonroot
        COPY --from=build /out/buzz-mayor-bridge /buzz-mayor-bridge
        COPY --from=build /bin/busybox /busybox
        USER nonroot:nonroot
        ENTRYPOINT ["/buzz-mayor-bridge"]
    environment:
      BUZZ_MAYOR_BRIDGE_ADDR: :8080
      # The core's raw-event client requires HTTP(S), so this is the private
      # Compose coordinate rather than the human-facing ws(s) relay URL.
      BUZZ_RELAY_URL: ${BUZZ_MAYOR_BRIDGE_RELAY_URL:?Set BUZZ_MAYOR_BRIDGE_RELAY_URL in .env}
      BUZZ_PUBLIC_RELAY_URL: ${BUZZ_PUBLIC_RELAY_URL:?Set BUZZ_PUBLIC_RELAY_URL in .env}
      BUZZ_MAYOR_CHANNEL_ID: ${BUZZ_MAYOR_CHANNEL_ID:-}
      BUZZ_ALLOWED_HUMAN_PUBKEYS: ${BUZZ_ALLOWED_HUMAN_PUBKEYS:-}
      BUZZ_BRIDGE_PRIVATE_KEY: ${BUZZ_BRIDGE_PRIVATE_KEY:-}
      BUZZ_LEDGER_PATH: /var/lib/buzz-mayor-bridge/ledger.json
      BUZZ_POLL_INTERVAL_SECONDS: ${BUZZ_POLL_INTERVAL_SECONDS:-15}
      BUZZ_BATCH_SIZE: ${BUZZ_BATCH_SIZE:-100}
      BUZZ_OVERLAP_SECONDS: ${BUZZ_OVERLAP_SECONDS:-60}
      BUZZ_READY_MAX_AGE_SECONDS: ${BUZZ_READY_MAX_AGE_SECONDS:-60}
      BUZZ_AGENT_MAIL_URL: http://mcp-agent-mail:8765/mcp
      BUZZ_AGENT_MAIL_HTTP_BEARER_TOKEN: ${MCP_AGENT_MAIL_BEARER_TOKEN:-}
      BUZZ_AGENT_MAIL_SENDER_TOKEN: ${BUZZ_AGENT_MAIL_BRIDGE_REGISTRATION_TOKEN:-}
      BUZZ_AGENT_MAIL_REGISTRATION_TOKEN: ${BUZZ_AGENT_MAIL_BRIDGE_REGISTRATION_TOKEN:-}
      BUZZ_AGENT_MAIL_PROJECT_KEY: ${MCP_AGENT_MAIL_PROJECT_KEY:-bootstrap-required}
      BUZZ_AGENT_MAIL_BRIDGE_IDENTITY: ${BUZZ_AGENT_MAIL_BRIDGE_IDENTITY:-buzz-mayor-bridge}
      BUZZ_AGENT_MAIL_MAYOR_IDENTITY: ${BUZZ_AGENT_MAIL_MAYOR_IDENTITY:-gas-city-mayor}
    volumes:
      - ./state/buzz-mayor-bridge:/var/lib/buzz-mayor-bridge
    depends_on:
      buzz-relay:
        condition: service_healthy
      mcp-agent-mail:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # Tracker-to-City intake is a separate private process from the status-only
  # gitea-bridge. It has no City API, issue-write, or run-mutation credential.
  gitea-mail-bridge:
    profiles: [gitea-mail-bridge]
    # Keep the bridge unprivileged even when the host operator uses UID 0.
    # Its ledger bind mount is owned by this distroless non-root identity.
    user: "65532:65532"
    build:
      context: ${GASCITY_GITEA_DIR:-${GITEA_BRIDGE_DIR:-../gascity-gitea}}
      args:
        GASCITY_GITEA_REF: ${GASCITY_GITEA_REF:-6a2c96f51f51464d7820756d8becae044cdad3eb}
      dockerfile_inline: |
        FROM golang:1.24-alpine AS build
        ARG GASCITY_GITEA_REF
        RUN apk add --no-cache git
        WORKDIR /src
        COPY go.mod ./
        RUN go mod download
        COPY . .
        RUN test -z "$$(git status --porcelain --untracked-files=all)" \
            && test "$$(git rev-parse HEAD)" = "$${GASCITY_GITEA_REF}" \
            && CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /out/gitea-mail-bridge ./cmd/gitea-mail-bridge
        FROM gcr.io/distroless/static-debian12:nonroot
        COPY --from=build /out/gitea-mail-bridge /gitea-mail-bridge
        USER nonroot:nonroot
        ENTRYPOINT ["/gitea-mail-bridge"]
    environment:
      GITEA_MAIL_BRIDGE_ADDR: :8080
      GITEA_URL: http://gitea:3000
      GITEA_TOKEN: ${GITEA_MAIL_BRIDGE_TOKEN:-}
      GITEA_WEBHOOK_SECRET: ${GITEA_MAIL_BRIDGE_WEBHOOK_SECRET:-}
      INTAKE_LEDGER_PATH: /var/lib/gitea-mail-bridge/ledger.json
      INTAKE_ACCOUNT: ${INTAKE_ACCOUNT:-gascity-mcp-mayor}
      INTAKE_MAYOR_ACTOR_ID: ${INTAKE_MAYOR_ACTOR_ID:-}
      INTAKE_REPOSITORY_SCOPES: ${INTAKE_REPOSITORY_SCOPES:-}
      INTAKE_CITY_IDENTITIES: ${INTAKE_CITY_IDENTITIES:-}
      INTAKE_MINIMUM_REPOSITORY_ROLE: ${INTAKE_MINIMUM_REPOSITORY_ROLE:-triage}
      INTAKE_APPROVAL_LABEL: ${INTAKE_APPROVAL_LABEL:-gc:intake-approved}
      INTAKE_CLAIMANT: ${INTAKE_CLAIMANT:-gitea-mail-bridge}
      INTAKE_OUTBOX_LEASE_SECONDS: ${INTAKE_OUTBOX_LEASE_SECONDS:-30}
      INTAKE_RECONCILE_SECONDS: ${INTAKE_RECONCILE_SECONDS:-30}
      INTAKE_AUTHORIZATION_TTL_SECONDS: ${INTAKE_AUTHORIZATION_TTL_SECONDS:-3600}
      INTAKE_MAIL_URL: http://mcp-agent-mail:8765/mcp
      INTAKE_MAIL_HTTP_BEARER_TOKEN: ${MCP_AGENT_MAIL_BEARER_TOKEN:-}
      INTAKE_MAIL_SENDER_TOKEN: ${MCP_AGENT_MAIL_BRIDGE_REGISTRATION_TOKEN:-}
      INTAKE_MAIL_REGISTRATION_TOKEN: ${MCP_AGENT_MAIL_BRIDGE_REGISTRATION_TOKEN:-}
      INTAKE_MAIL_PROJECT_KEY: ${MCP_AGENT_MAIL_PROJECT_KEY:-bootstrap-required}
      INTAKE_MAIL_BRIDGE_IDENTITY: ${INTAKE_MAIL_BRIDGE_IDENTITY:-gitea-mail-bridge}
      INTAKE_MAIL_MAYOR_IDENTITY: ${INTAKE_MAIL_MAYOR_IDENTITY:-gas-city-mayor}
      INTAKE_MAIL_LAUNCHER_IDENTITY: ${INTAKE_MAIL_LAUNCHER_IDENTITY:-gas-city-launcher}
      INTAKE_PERMISSION_READER_URL: http://gitea-intake-permission-reader:8080/v1/repository-role
      INTAKE_PERMISSION_READER_BEARER_TOKEN: ${GITEA_INTAKE_PERMISSION_READER_BEARER_TOKEN:-}
    volumes:
      - ./state/gitea-mail-bridge:/var/lib/gitea-mail-bridge
    depends_on:
      gitea:
        condition: service_healthy
      mcp-agent-mail:
        condition: service_healthy
      gitea-intake-permission-reader:
        condition: service_healthy
    restart: unless-stopped

  gitea-intake-permission-reader:
    profiles: [gitea-mail-bridge]
    image: python:3.13-alpine
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - python3
      - /usr/local/bin/gitea-intake-permission-reader.py
    environment:
      GITEA_URL: http://gitea:3000
      INTAKE_REPOSITORY_SCOPES: ${INTAKE_REPOSITORY_SCOPES:-}
      GITEA_INTAKE_PERMISSION_READER_SECRET_FILE: /run/secrets/city-mail/permission-reader.env
    volumes:
      - ./scripts/gitea-intake-permission-reader.py:/usr/local/bin/gitea-intake-permission-reader.py:ro
      - ./state/city-mail-secrets/permission-reader.env:/run/secrets/city-mail/permission-reader.env:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      gitea:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/liveness')"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  # The launcher consumes bridge-issued authorizations and can start only the
  # fixed Mayor formula. It has no tracker or City HTTP authority.
  city-mail-launcher:
    profiles: [gitea-mail-bridge]
    # Match the host-mapped City worker so both sides can access the private
    # queue without relaxing its 0700 directory or 0600 file permissions.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile.city
      target: launcher-runtime
      args:
        GASCITY_REF: ${GASCITY_REF:-ab54f93c3b3d30bb8f52f7e92c0761fb75340752}
        GASCITY_REPOSITORY: ${GASCITY_REPOSITORY:-https://github.com/gastownhall/gascity.git}
        CAGENT_REF: ${CAGENT_REF:-v1.23.0}
    environment:
      CITY_MAIL_LAUNCHER_SECRET_FILE: /run/secrets/city-mail/launcher.env
      CITY_MAIL_LAUNCHER_STATE: /var/lib/city-mail-launcher/ledger.json
      CITY_MAIL_LAUNCHER_QUEUE: /var/lib/city-mail-launcher
      CITY_MAIL_LAUNCHER_RIG: ${CITY_MAIL_LAUNCHER_RIG:?set CITY_MAIL_LAUNCHER_RIG to the authorized City rig}
      CITY_MAIL_LAUNCHER_BRIDGE_IDENTITY: ${INTAKE_MAIL_BRIDGE_IDENTITY:-gitea-mail-bridge}
      CITY_MAIL_LAUNCHER_MAIL_URL: http://mcp-agent-mail:8765/mcp
    volumes:
      - ./state/city-mail-secrets/launcher.env:/run/secrets/city-mail/launcher.env:ro
      - ./state/city-mail-launcher:/var/lib/city-mail-launcher
    depends_on:
      mcp-agent-mail:
        condition: service_healthy
      gitea-mail-bridge:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  gascity-mcp:
    profiles: [mcp]
    build:
      # A local checkout may override this for development. The public default
      # is an immutable Git build context, so a fresh Compose clone is complete.
      context: ${GASCITY_MCP_DIR:-https://github.com/cyberstorm-dev/gascity-mcp.git#c3585886676ec3ac20f561bfb82235d5278b92c6}
    environment:
      GASCITY_API_URL: http://city:8372
      GASCITY_API_HOST: 127.0.0.1:8372
      GASCITY_CITY_NAME: ${CITY_NAME:-my-city}
      GASCITY_MCP_HOST: 0.0.0.0
      GASCITY_MCP_PORT: "8766"
    ports:
      - "127.0.0.1:${GASCITY_MCP_PORT:-8766}:8766"
    depends_on:
      city:
        condition: service_started
        required: false
    restart: unless-stopped

  # One explicit City run -> one explicit Gitea issue. This first bridge is
  # status-only and has no gate-resolution, bead-close, or issue-close authority.
  gitea-bridge:
    profiles: [gitea-bridge]
    build:
      context: ${GASCITY_GITEA_DIR:-${GITEA_BRIDGE_DIR:-../gascity-gitea}}
      args:
        GASCITY_GITEA_REF: ${GASCITY_GITEA_REF:-6a2c96f51f51464d7820756d8becae044cdad3eb}
      dockerfile_inline: |
        FROM golang:1.24-alpine AS build
        ARG GASCITY_GITEA_REF
        RUN apk add --no-cache git
        WORKDIR /src
        COPY go.mod ./
        RUN go mod download
        COPY . .
        RUN test "$$(git rev-parse HEAD)" = "$${GASCITY_GITEA_REF}" \
            && CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /out/gitea-bridge ./cmd/gitea-bridge
        FROM gcr.io/distroless/static-debian12:nonroot
        COPY --from=build /out/gitea-bridge /gitea-bridge
        USER nonroot:nonroot
        ENTRYPOINT ["/gitea-bridge"]
    environment:
      GITEA_URL: http://gitea:3000
      GITEA_TOKEN: ${GITEA_BRIDGE_TOKEN:-}
      GITEA_ISSUE_URL: ${GITEA_BRIDGE_ISSUE_URL:-}
      GASCITY_API_URL: http://city:8372
      GASCITY_CITY_NAME: ${CITY_NAME:-my-city}
      GASCITY_RUN_ID: ${GITEA_BRIDGE_RUN_ID:-}
      BRIDGE_INTERVAL_SECONDS: ${GITEA_BRIDGE_INTERVAL_SECONDS:-30}
    depends_on:
      gitea:
        condition: service_healthy
      city:
        condition: service_started
        required: false
    restart: unless-stopped

  # Official Gitea MCP instances are separated by the three permission classes
  # Gas City actually uses. City transition policy remains in the non-MCP
  # gitea-bridge controller.
  gitea-mcp-mayor:
    profiles: [gitea-mcp]
    image: ${GITEA_MCP_IMAGE:-docker.gitea.com/gitea-mcp-server@sha256:dda8d56e6a91fa89cad186becc27c7aa83d74acdd5dc69f89af840d7bb78a631}
    entrypoint: ["/app/gitea-mcp"]
    command: ["-t", "http", "-p", "8080"]
    environment:
      GITEA_HOST: http://gitea:3000
      GITEA_ACCESS_TOKEN: ${GITEA_MAYOR_TOKEN:-}
      # Planning/status comments and issue labels only. issue_write can manage
      # issue labels; label_write would also permit label-definition deletion.
      GITEA_TOOLS: issue_read,issue_write,label_read
    ports:
      - "127.0.0.1:${GITEA_MCP_MAYOR_PORT:-8771}:8080"
    depends_on:
      gitea:
        condition: service_healthy
    restart: unless-stopped

  gitea-mcp-observer:
    profiles: [gitea-mcp]
    image: ${GITEA_MCP_IMAGE:-docker.gitea.com/gitea-mcp-server@sha256:dda8d56e6a91fa89cad186becc27c7aa83d74acdd5dc69f89af840d7bb78a631}
    entrypoint: ["/app/gitea-mcp"]
    command: ["-t", "http", "-p", "8080"]
    environment:
      GITEA_HOST: http://gitea:3000
      GITEA_ACCESS_TOKEN: ${GITEA_OBSERVER_TOKEN:-}
      GITEA_READONLY: "true"
      # Shared by Deacon, Boot, and workers until a separate worker capability
      # is justified. It can inspect state but cannot mutate Gitea.
      GITEA_TOOLS: issue_read,label_read
    ports:
      - "127.0.0.1:${GITEA_MCP_OBSERVER_PORT:-8772}:8080"
    depends_on:
      gitea:
        condition: service_healthy
    restart: unless-stopped

  gitea-mcp-witness:
    profiles: [gitea-mcp]
    image: ${GITEA_MCP_IMAGE:-docker.gitea.com/gitea-mcp-server@sha256:dda8d56e6a91fa89cad186becc27c7aa83d74acdd5dc69f89af840d7bb78a631}
    entrypoint: ["/app/gitea-mcp"]
    command: ["-t", "http", "-p", "8080"]
    environment:
      GITEA_HOST: http://gitea:3000
      GITEA_ACCESS_TOKEN: ${GITEA_WITNESS_TOKEN:-}
      # Evidence comments and issue-level QA labels, not label definitions.
      GITEA_TOOLS: issue_read,issue_write,label_read
    ports:
      - "127.0.0.1:${GITEA_MCP_WITNESS_PORT:-8773}:8080"
    depends_on:
      gitea:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.138.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./state/prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - ./state/loki:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-${STACK_USERNAME:-admin}}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-${STACK_PASSWORD:?Set STACK_PASSWORD in .env}}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${OLLAMA_METRICS_DIR:-../ollama-metrics}/prometheus:/var/lib/grafana/ollama-metrics-dashboard:ro
      - ./state/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

  role-health:
    build:
      context: ./role-health
    environment:
      CITY_API: ${CITY_API:-http://city:8372}
      CITY_API_HOST: ${CITY_API_HOST:-127.0.0.1:8372}
      CITY_NAME: ${CITY_NAME:-my-city}
    depends_on:
      city:
        condition: service_started
        required: false
    restart: unless-stopped

  gatus:
    image: twinproduction/gatus:v5.26.0
    volumes:
      - ./gatus.yaml:/config/config.yaml:ro
      - ./state/gatus:/data
    ports:
      - "127.0.0.1:${GATUS_PORT:-8080}:8080"
    depends_on:
      gitea:
        condition: service_healthy
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    command: ["--path.rootfs=/host"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    restart: unless-stopped

networks:
  woodpecker:
    name: gascity-woodpecker
