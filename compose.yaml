name: gascity

services:
  # Deliberately profile-gated: never run two supervisors against one city.
  city:
    profiles: [city]
    # Match the owner of linked city/rig paths so Gas City can maintain their
    # local Dolt mirrors without granting the controller root access.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile.city
      args:
        # Pin this to the commit used by the host supervisor before handoff.
        GASCITY_REF: ${GASCITY_REF:-ab54f93c3b3d30bb8f52f7e92c0761fb75340752}
        CAGENT_REF: ${CAGENT_REF:-v1.23.0}
    environment:
      GC_HOME: /var/lib/gascity
      HOME: /var/lib/gascity/home
      CITY_PATH: ${CITY_DIR:?Set CITY_DIR in .env to the absolute city path}
      CITY_NAME: ${CITY_NAME:-my-city}
      GC_OTEL_METRICS_URL: http://otel-collector:4318/v1/metrics
      GC_OTEL_LOGS_URL: http://otel-collector:4318/v1/logs
      OLLAMA_HOST: http://ollama:11434
      CODEX_HOME: /run/codex
      DOLT_USER_NAME: ${DOLT_USER_NAME:-Allen Day}
      DOLT_USER_EMAIL: ${DOLT_USER_EMAIL:-allenday@allenday.com}
    volumes:
      - ${CITY_DIR:?Set CITY_DIR in .env to the absolute city path}:${CITY_DIR:?Set CITY_DIR in .env to the absolute city path}
      - ${MY_PROJECT_DIR:?Set MY_PROJECT_DIR in .env to the linked rig path}:${MY_PROJECT_DIR:?Set MY_PROJECT_DIR in .env to the linked rig path}
      - ${GASCITY_SOURCE_DIR:?Set GASCITY_SOURCE_DIR in .env to the Gas City source rig}:${GASCITY_SOURCE_DIR:?Set GASCITY_SOURCE_DIR in .env to the Gas City source rig}
      - ${CODEX_AUTH_FILE:?Set CODEX_AUTH_FILE in .env to the host Codex auth file}:/run/secrets/codex-auth.json:ro
      - ./state/gc-runtime:/var/lib/gascity
    tmpfs:
      # The City process runs as the configured unprivileged host UID/GID,
      # which copies the read-only host credential into this ephemeral home.
      - /run/codex:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0700
    ports:
      - "127.0.0.1:8372:8372"
    depends_on:
      otel-collector:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    # City requires a reachable model service; the models profile remains
    # useful for explicit model pulling through model-init.
    profiles: [city, models]
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./state/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 12

  model-init:
    profiles: [models]
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    entrypoint: ["/bin/sh", "-ec", "ollama pull \"$${OLLAMA_MODEL}\""]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  gitea:
    image: gitea/gitea:1.27.2-rootless
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: 127.0.0.1
      GITEA__server__ROOT_URL: http://127.0.0.1:${GITEA_HTTP_PORT:-3002}/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__server__SSH_DOMAIN: 127.0.0.1
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2223}
      GITEA__server__SSH_LISTEN_PORT: "2222"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__webhook__ALLOWED_HOST_LIST: 127.0.0.1,localhost
      GITEA__log__LEVEL: info
    ports:
      - "127.0.0.1:${GITEA_HTTP_PORT:-3002}:3000"
      - "127.0.0.1:${GITEA_SSH_PORT:-2223}:2222"
    volumes:
      - ${GITEA_STATE_DIR:-./state/gitea}/data:/var/lib/gitea
      - ${GITEA_STATE_DIR:-./state/gitea}/config:/etc/gitea
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  mcp-agent-mail:
    profiles: [mcp]
    build:
      context: .
      dockerfile: Dockerfile.mcp-agent-mail
    restart: unless-stopped
    volumes:
      - ./state/mcp-agent-mail:/var/lib/mcp-mail
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/liveness')"]
      interval: 15s
      timeout: 5s
      retries: 8

  gascity-mcp:
    profiles: [mcp]
    build:
      context: ${GASCITY_MCP_DIR:-../gascity-mcp}
    environment:
      GASCITY_API_URL: http://city:8372
      GASCITY_API_HOST: 127.0.0.1:8372
      GASCITY_CITY_NAME: ${CITY_NAME:-my-city}
      GASCITY_MCP_HOST: 0.0.0.0
      GASCITY_MCP_PORT: "8766"
    ports:
      - "127.0.0.1:${GASCITY_MCP_PORT:-8766}:8766"
    depends_on:
      city:
        condition: service_started
        required: false
    restart: unless-stopped

  # Official Gitea MCP instances are separated by the three permission classes
  # Gas City actually uses. City transition policy remains in the non-MCP
  # gitea-bridge controller.
  gitea-mcp-mayor:
    profiles: [gitea-mcp]
    image: ${GITEA_MCP_IMAGE:-docker.gitea.com/gitea-mcp-server@sha256:dda8d56e6a91fa89cad186becc27c7aa83d74acdd5dc69f89af840d7bb78a631}
    entrypoint: ["/app/gitea-mcp"]
    command: ["-t", "http", "-p", "8080"]
    environment:
      GITEA_HOST: http://gitea:3000
      GITEA_ACCESS_TOKEN: ${GITEA_MAYOR_TOKEN:-}
      # Planning/status comments and issue labels only. issue_write can manage
      # issue labels; label_write would also permit label-definition deletion.
      GITEA_TOOLS: issue_read,issue_write,label_read
    ports:
      - "127.0.0.1:${GITEA_MCP_MAYOR_PORT:-8771}:8080"
    depends_on:
      gitea:
        condition: service_healthy
    restart: unless-stopped

  gitea-mcp-observer:
    profiles: [gitea-mcp]
    image: ${GITEA_MCP_IMAGE:-docker.gitea.com/gitea-mcp-server@sha256:dda8d56e6a91fa89cad186becc27c7aa83d74acdd5dc69f89af840d7bb78a631}
    entrypoint: ["/app/gitea-mcp"]
    command: ["-t", "http", "-p", "8080"]
    environment:
      GITEA_HOST: http://gitea:3000
      GITEA_ACCESS_TOKEN: ${GITEA_OBSERVER_TOKEN:-}
      GITEA_READONLY: "true"
      # Shared by Deacon, Boot, and workers until a separate worker capability
      # is justified. It can inspect state but cannot mutate Gitea.
      GITEA_TOOLS: issue_read,label_read
    ports:
      - "127.0.0.1:${GITEA_MCP_OBSERVER_PORT:-8772}:8080"
    depends_on:
      gitea:
        condition: service_healthy
    restart: unless-stopped

  gitea-mcp-witness:
    profiles: [gitea-mcp]
    image: ${GITEA_MCP_IMAGE:-docker.gitea.com/gitea-mcp-server@sha256:dda8d56e6a91fa89cad186becc27c7aa83d74acdd5dc69f89af840d7bb78a631}
    entrypoint: ["/app/gitea-mcp"]
    command: ["-t", "http", "-p", "8080"]
    environment:
      GITEA_HOST: http://gitea:3000
      GITEA_ACCESS_TOKEN: ${GITEA_WITNESS_TOKEN:-}
      # Evidence comments and issue-level QA labels, not label definitions.
      GITEA_TOOLS: issue_read,issue_write,label_read
    ports:
      - "127.0.0.1:${GITEA_MCP_WITNESS_PORT:-8773}:8080"
    depends_on:
      gitea:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.138.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./state/prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - ./state/loki:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./state/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

  role-health:
    build:
      context: ./role-health
    environment:
      CITY_API: ${CITY_API:-http://city:8372}
      CITY_API_HOST: ${CITY_API_HOST:-127.0.0.1:8372}
      CITY_NAME: ${CITY_NAME:-my-city}
    depends_on:
      city:
        condition: service_started
        required: false
    restart: unless-stopped

  gatus:
    image: twinproduction/gatus:v5.26.0
    volumes:
      - ./gatus.yaml:/config/config.yaml:ro
      - ./state/gatus:/data
    ports:
      - "127.0.0.1:${GATUS_PORT:-8080}:8080"
    depends_on:
      gitea:
        condition: service_healthy
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    command: ["--path.rootfs=/host"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    restart: unless-stopped
